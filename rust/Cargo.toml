[workspace]
members = ["core", "ui", "barb"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The UI tests play thousands of random keys on an emulated terminal; unoptimized, that is slow.
[profile.test]
opt-level = 1
